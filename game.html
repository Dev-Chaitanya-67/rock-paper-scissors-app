<!DOCTYPE html>
<html lang="en">

<head>
  <title>Game</title>
  <link rel="stylesheet" href="Styles/game.css">
</head>

<body>
  <div>
    <p class="title">
      Rock Paper Scissors
    </p>
    
    <button class="moves-btn js-rock-btn">
      <img src="icons/rock-emoji.png" class="move-icon">
    </button>

    <button class="moves-btn js-paper-btn">
      <img src="icons/paper-emoji.png" class="move-icon">
    </button>

    <button class="moves-btn">
      <img src="icons/scissors-emoji.png" class="move-icon js-scissors-btn">
    </button>

    <p class="result js-result"></p>

    <p class="moves js-moves"></p>

    <p class="score js-score"></p>

    <button class="reset-score-btn js-reset-score">
      Reset Score
    </button>

    <button class="auto-play-button js-autoPlay">
      Auto Play
    </button>

    <div class="js-reset-confirmation"></div>

  </div>

  <script src="Scripts/game.js"></script>
</body>

</html>
